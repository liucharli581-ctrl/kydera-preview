document.getElementById("gate").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err");
  err.classList.remove("on");
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),
      "PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:600000,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV,tagLength:128},key,DATA);
    const html=new TextDecoder().decode(buf);
    document.documentElement.innerHTML="<head><meta charset='utf-8'><meta name='robots' content='noindex, nofollow'><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style></head><body></body>";
    const frame=document.createElement("iframe");
    frame.setAttribute("sandbox","allow-scripts allow-same-origin allow-downloads");
    frame.srcdoc=html;
    document.body.appendChild(frame);
  }catch(ex){ err.classList.add("on"); }
});
</script>
