document.getElementById("gate").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err");
  err.classList.remove("on");
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),
      "PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:600000,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV,tagLength:128},key,DATA);
    const html=new TextDecoder().decode(buf);
    // Hand the document over to the wireframe itself. Loading it into an iframe srcdoc
    // looked fine, but any in-page "#/route" link re-navigated the srcdoc document and left
    // a blank frame — the deck's own navigation and the browser back button need a real
    // document. The hash already in the address bar is picked up by the wireframe on load,
    // so deep links survive the unlock.
    document.open();
    document.write(html);
    document.close();
  }catch(ex){ err.classList.add("on"); }
});
// if a password ever reached the query string, drop it from the address bar
if(/[?&]pw=/.test(location.search)){
  history.replaceState(null,"",location.pathname+location.hash);
}
window.__gateReady=true;
